name: Crealipen
version: "0.3.1"
slug: crealipen
description: Turn uploaded images into pen drawings on a CR-10s pen plotter
url: https://github.com/bmcandy/3d-plotter
arch:
  - aarch64
  - amd64
# the HA base image provides its own s6 init; Docker's init wrapper would
# stop s6 from being PID 1 (s6-overlay-suexec fatal)
init: false
startup: services
ingress: true
panel_icon: mdi:pen
panel_title: Crealipen
panel_admin: false
uart: true
map:
  - share:rw
options:
  simulate: false
  serial_port: ""
schema:
  simulate: bool
  serial_port: str?
