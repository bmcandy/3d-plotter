name: Publish app image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *"\{0,1\}\([0-9.]*\)"\{0,1\}/\1/p' crealipen/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crealipen/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/crealipen-${{ matrix.arch }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
