name: Version check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a semantic version bump
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base_rev=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base_rev=HEAD^
          fi
          base_v=$(git show "$base_rev:crealipen/config.yaml" | sed -n 's/^version: *"\{0,1\}\([0-9.]*\)"\{0,1\}/\1/p')
          head_v=$(sed -n 's/^version: *"\{0,1\}\([0-9.]*\)"\{0,1\}/\1/p' crealipen/config.yaml)
          for v in "$base_v" "$head_v"; do
            if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::invalid version '$v' in crealipen/config.yaml (expected MAJOR.MINOR.PATCH)"
              exit 1
            fi
          done
          if [ "$head_v" = "$base_v" ] || \
             [ "$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | head -n1)" != "$base_v" ]; then
            echo "::error::app version must increase per semver: $base_v -> $head_v"
            exit 1
          fi
          echo "version bump ok: $base_v -> $head_v"
