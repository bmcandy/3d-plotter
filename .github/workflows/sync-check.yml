name: App sync check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rebuild the deployment copy
        run: bash scripts/sync-app.sh
      - name: Fail if crealipen/ is out of sync
        run: |
          if ! git diff --quiet -- crealipen/; then
            git diff --stat -- crealipen/
            echo "::error::crealipen/ is stale — run scripts/sync-app.sh and commit the result"
            exit 1
          fi
